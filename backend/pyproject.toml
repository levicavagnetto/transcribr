[project]
name = "transcribr"
version = "0.1.0"
description = "Collects a store's Ravon call recordings, transcribes them and matches calls to people."
requires-python = ">=3.14,<3.15"
dependencies = [
    "argon2-cffi>=23.1",
    "av>=16,<19",
    "fastapi>=0.115",
    "faster-whisper>=1.2.1",
    "httpx>=0.28",
    "numpy>=2.1",
    "pydantic>=2.9",
    "rapidfuzz>=3.9",
    "sherpa-onnx>=1.12",
    "tzdata>=2024.1",
    "uvicorn>=0.32",
]

[project.scripts]
transcribr = "transcribr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcribr"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "PL", "RUF"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "PLR0911", "PLR0913", "PLC0415", "SIM103"]

[tool.pyright]
include = ["transcribr", "tests", "../scripts"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
strict = ["transcribr"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m \"not realsite and not model and not slow\""
markers = [
    "realsite: talks to the real Ravon site; only run by the user on request",
    "model: needs the real speech and speaker models",
    "slow: takes more than a few seconds",
]
