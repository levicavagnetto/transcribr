openapi: 3.0.0
info:
  title: Ravon Admin (internal, reverse-engineered)
  version: 1.0.0
  description: >-
    Undocumented internal API of admin.ravon.net, inferred from browser captures.
    Auth is a session cookie from the /auth/login form POST. It may change without notice.
servers:
- url: https://admin.ravon.net
  description: The default server
paths:
  /ajax.html:
    get:
      summary: RPC-style endpoint; the action is selected with REQUEST
      description: |-
        - getSessionTTL: returns SessionTTL.
        - heartbeat: keepalive; empty 200 body. The page sends it every ~5 s.
        - updateManagerSession: realtime calls feed, polled ~1/s. First call with
          sessionID empty and reset=true (may 304), then reset=false with the returned
          sessionID; each response carries only what changed since the last poll.
      parameters:
      - name: REQUEST
        in: query
        required: true
        schema:
          type: string
          enum: [getSessionTTL, heartbeat, updateManagerSession]
      - name: sessionID
        in: query
        required: false
        description: updateManagerSession only. Empty on the first poll, then the value returned.
        schema:
          type: string
      - name: reset
        in: query
        required: false
        description: updateManagerSession only. true requests full state.
        schema:
          type: boolean
      - name: _
        in: query
        required: false
        description: Cache-buster (epoch ms).
        schema:
          type: number
      responses:
        '200':
          description: Shape depends on REQUEST.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SessionTTL'
                - $ref: '#/components/schemas/ManagerSessionUpdate'
        '304':
          description: Not modified (seen on the first updateManagerSession poll).
  /api/v1/ntp/{id}:
    get:
      summary: GET ntp by id
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  t0:
                    type: number
                  t1:
                    type: number
                  t2:
                    type: number
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: _
        in: query
        required: false
        schema:
          type: number
  /realtime/manage_recorded_calls.html:
    get:
      summary: GET manage_recorded_calls.html
      responses:
        '200':
          description: OK
          content: {}
    post:
      summary: POST manage_recorded_calls.html
      responses:
        '200':
          description: OK
          content: {}
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                queue:
                  type: string
                user:
                  type: string
                conferencePK:
                  type: string
                startDate:
                  type: string
                endDate:
                  type: string
                ani:
                  type: string
                dnis:
                  type: string
                query:
                  type: string
  /recordings/{id}:
    get:
      summary: GET recordings by id
      responses:
        '200':
          description: OK
          content: {}
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
