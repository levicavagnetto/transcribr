components:
  schemas:
    SessionTTL:
      type: object
      properties:
        id: {type: string, description: Server session id}
        ttl: {type: integer, description: Seconds left (1800 max)}
        max: {type: integer}
    ManagerSessionUpdate:
      type: object
      description: Delta since the previous poll.
      properties:
        sessionID: {type: integer, description: Send back as sessionID on the next poll}
        updatedCalls: {type: array, items: {$ref: '#/components/schemas/Call'}}
        removedCalls: {type: array, description: uniqueIDs of calls that ended, items: {type: string}}
        updatedUsers: {type: array, items: {$ref: '#/components/schemas/User'}}
        updatedQueues: {type: array, items: {$ref: '#/components/schemas/Queue'}}
        updatedMailboxes: {type: array, items: {$ref: '#/components/schemas/Mailbox'}}
        updatedHints: {type: array, items: {$ref: '#/components/schemas/Hint'}}
        updatedPhonebooks: {type: array, items: {$ref: '#/components/schemas/Phonebook'}}
    Call:
      type: object
      description: One call leg (Asterisk channel). A call is a tree of legs via parentCall/childCalls.
      properties:
        uniqueID: {type: string, example: '1792686976.53086', description: Asterisk uniqueid; also used in removedCalls}
        channelName: {type: string, example: PJSIP/proxy_sip01-00004405}
        companyID: {type: string}
        callStart: {type: integer, description: Epoch ms}
        answeredAt: {type: integer, nullable: true, description: Epoch ms}
        state: {type: string, description: Asterisk channel state, enum: [Down, Ring, Ringing, Up]}
        isRinging: {type: boolean}
        callerIDName: {type: string, nullable: true}
        callerIDNumber: {type: string}
        calledNumber: {type: string}
        fromString: {type: string, description: Display text}
        toString: {type: string, description: Display text}
        fromUser: {type: string, nullable: true, description: Username if internal}
        toUser: {type: string, nullable: true}
        parentCall: {type: string, nullable: true}
        childCalls: {type: array, items: {type: string}}
        queue: {type: string, nullable: true}
        queuePosition: {type: integer, nullable: true}
        queueEntryTime: {type: integer, nullable: true}
        queueCallback: {type: boolean}
        ivr: {type: string, nullable: true}
        conference: {type: string, nullable: true}
        parkingSpace: {type: string, nullable: true}
        unparkAt: {type: integer, nullable: true}
    User:
      type: object
      properties:
        username: {type: string, description: '<companyID>-<shortUsername>'}
        shortUsername: {type: string}
        name: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        url: {type: string, description: HTML link}
        extension: {type: string}
        email: {type: string}
        voicemail: {type: boolean}
        status: {type: string, nullable: true}
        statusInt: {type: integer, nullable: true}
        hint: {type: string, nullable: true}
        queues: {type: array, items: {type: string}}
        available: {type: boolean}
        paused: {type: boolean}
        pauseCode: {type: string, nullable: true}
        pauseCodeText: {type: string, nullable: true}
        newMessages: {type: integer, nullable: true}
        calls: {type: array, description: uniqueIDs of this user's calls, items: {type: string}}
    Queue:
      type: object
      properties:
        username: {type: string}
        shortUsername: {type: string}
        companyID: {type: string}
        name: {type: string}
        url: {type: string}
        extension: {type: string}
        voicemail: {type: boolean}
        avgHoldTime: {type: number}
        abandonedCalls: {type: integer}
        avgAbandonTime: {type: number}
        answeredCalls: {type: integer}
        avgAnswerTime: {type: number}
        completedCalls: {type: integer}
        avgTalkTime: {type: number}
        calls: {type: array, items: {type: string}}
        members:
          type: object
          description: Keyed by username
          additionalProperties: {$ref: '#/components/schemas/QueueMember'}
        newMessages: {type: integer, nullable: true}
    QueueMember:
      type: object
      properties:
        status: {type: string, example: Not In Use}
        statusID: {type: integer}
        statusChangedAt: {type: integer, description: Epoch ms}
        paused: {type: boolean}
        pauseCode: {type: string, nullable: true}
        pauseCodeName: {type: string, nullable: true}
        rna: {type: integer, description: Ring-no-answer count}
        membership: {type: string, example: Static}
        membershipID: {type: string}
        callsTaken: {type: integer}
        lastCallAt: {type: integer, nullable: true}
    Mailbox:
      type: object
      properties:
        username: {type: string}
        companyID: {type: string}
        extension: {type: string}
        isQueue: {type: boolean}
        isUser: {type: boolean}
        mailboxes: {type: object}
        newMessages: {type: integer}
    Hint:
      type: object
      properties:
        extension: {type: string}
        status: {type: string}
        statusInt: {type: integer}
        available: {type: boolean}
        parkingSpace: {type: string, nullable: true}
        phones: {type: array, items: {type: object}}
    Phonebook:
      type: object
      properties:
        username: {type: string}
        entries: {type: array, items: {type: object}}
