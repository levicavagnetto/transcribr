schema: spec-driven

context: |
  Transcribr v2: pulls a tire shop's call recordings from the Ravon PBX admin site
  (admin.ravon.net), transcribes them, and attributes calls to service writers so they
  can research customer requests in their own ChatGPT.
  Architecture draft and block diagram: docs/architecture.md (keep it in sync with design.md).

  Hard constraints:
  - Fresh rewrite. ../transcribr_old (v1) may be used only for verified facts about Ravon and
    the audio, never for its design, plans or code structure.
  - Bare-bones but robust: prefer the fewest moving parts that still survive restarts,
    crashes and Ravon outages. No janky workarounds.
  - Ravon is read-only. Only the transcribr app talks to Ravon, through a request allow
    list. Never call any action that changes data there (live-call tools, deletes, edits).
  - LLMs never talk to Ravon. LLM -> transcribr CLI (`docker compose exec web transcribr
    calls|people ...`) -> transcribr DB. The data commands never contact Ravon or touch
    credentials. Nothing is hosted for LLMs: no MCP server, tunnel or OAuth.
  - Ravon's user/extension filters do not identify the service writer (inbound calls land
    on the main store line). Attribution is per call, never per line: it comes from the
    transcript (a name said in the call makes a Maybe) and from people's own claim, confirm
    and reject, stored per call as person + method + status. Voice matching was tried and
    removed: it could not tell the shop's service writers apart on phone audio.
    Transcripts have no speaker labels (diarization was dropped after live testing).
  - Profiles (people and name variants) and all settings are configured per
    instance in the UI and stored in /data. Nothing person- or store-specific in code.
  - Visibility: everyone on the shop network sees all calls and can use every call-screen
    action (claim, reject, confirm) without logging in; profiles are filters.
    People and Settings live under /admin behind one admin login, created on first visit
    with a one-time setup code from the server log. The server enforces admin auth on
    every /api/v1/admin route; hiding links is not protection.
    Keep attribution (data) separate from access rules so access can tighten later.
  - Transcription rule: every call is listed. Calls that end while the server is running
    are transcribed automatically. Calls missed while it was off are listed as
    "Not transcribed" and are only transcribed when a user clicks Transcribe. Never
    auto-backfill.
  - Audio is never stored; fetch it from Ravon into memory when needed. Recordings are mono.
  - Runs on a shop PC from one Docker image (multi-stage: Node builds the React +
    TypeScript + MUI UI) as two compose services sharing one named volume: `web`
    (FastAPI serves UI + API) and `worker` (poller + pipeline). Must run on
    Linux, Windows (Docker Desktop/WSL2) and macOS, amd64 (64-bit Intel/AMD). CPU only, no GPU.
  - Build order (one OpenSpec change each, archived before the next starts):
    add-call-transcription-core (Ravon -> transcribe, settings, admin, shell, Docker),
    add-call-browser (call list, detail, Listen, Copy for ChatGPT),
    add-call-attribution (people, name matching, People screen),
    add-data-cli (calls and people commands for LLMs and scripts).
    Later changes mostly add requirements to earlier capabilities; when real use shows an
    earlier requirement is wrong, a later change modifies it through its delta specs.

